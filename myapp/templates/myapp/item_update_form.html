{% extends 'myapp/base.html' %}
{% block body %}
<div class="flex flex-col justify-center items-center min-h-screen p-10">
  <form method="POST" class="shadow-lg space-y-6 p-10 w-96">
    {% csrf_token %}

    {% for field in form %}
    <div>
      <label for="">{{field.label}}</label>
      <div class="border rounded p-2">{{field}}</div>
    </div>
    <!---->
    {% if field.errors %}
    <div class="bg-gray-200 text-red-500 p-2">
      {% for error in field.errors %}
      <ol class="list-disc pl-5">
        <li>{{error}}</li>
      </ol>
      <!---->
      {% endfor %}
    </div>
    {% endif %}
    <!---->
    {% endfor %}
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 w-full cursor-pointer">Update</button>
  </form>
</div>
{% endblock %}
